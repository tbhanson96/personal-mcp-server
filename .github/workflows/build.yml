name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: dependencies-${{ github.sha }}

  build:
    name: Build project
    runs-on: ubuntu-24.04-arm
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: dependencies-${{ github.sha }}

      - name: Build
        run: npm run build

  test:
    name: Test project
    runs-on: ubuntu-24.04-arm
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: dependencies-${{ github.sha }}

      - name: Test
        run: npm test

      - name: Verify tool schema manifest
        run: npm run tools:manifest:check

      - name: Audit
        run: npm audit --omit=dev
